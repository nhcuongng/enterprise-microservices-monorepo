version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  # --- DATABASES ---
  postgres-user:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    networks:
      - app-network

